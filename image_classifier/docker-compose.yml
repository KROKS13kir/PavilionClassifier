services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: pavilion_audit
      POSTGRES_USER: AdminUser
      POSTGRES_PASSWORD: ADUSER
    ports:
      - "5432:5432"

  redis:
    image: redis:7

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        python manage.py migrate &&
        gunicorn image_classifier.wsgi:application --bind 0.0.0.0:8000
      "
    ports:
      - "8000:8000"

  celery:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    command: celery -A image_classifier worker --loglevel=info
    depends_on:
      - backend
      - redis

  telegram:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    command: python -m telegram_bot.bot
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend

  nginx:
    image: nginx:stable
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./frontend/dist:/var/www/html
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/html \
        --email kirill.kornienko2018@yandex.ru \
        --agree-tos \
        --no-eff-email \
        -d pavilion-classifier.ru -d www.pavilion-classifier.ru"

volumes:
  postgres_data:
  certbot-etc:
  certbot-var:
