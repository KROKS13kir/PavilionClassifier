
services:
  db:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: pavilion_audit
      POSTGRES_USER: AdminUser
      POSTGRES_PASSWORD: ADUSER
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U AdminUser"]
      interval: 30s
      retries: 5

  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      retries: 5

  backend:
    image: kroks/pavilion_audit-backend:${TAG}
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 30s
      retries: 3

  celery:
    image: kroks/pavilion_audit-backend:${TAG}
    restart: always
    env_file:
      - ./backend/.env
    command: celery -A image_classifier worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  telegram:
    image: kroks/pavilion_audit-backend:${TAG}
    restart: always
    env_file:
      - ./backend/.env
    command: python manage.py runbot
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8443:8443"

  frontend:
    image: kroks/pavilion_audit-frontend:${TAG}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost || exit 1"]
      interval: 1m
      retries: 3

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./frontend/dist:/var/www/html
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/html && sleep 12h;
             done"

volumes:
  postgres_data:
  certbot-etc:
  certbot-var:
