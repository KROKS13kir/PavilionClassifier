name: CI/CD

on:
  push:
    branches: [ main ]

env:
  BACKEND_REPO: kroks/pavilion_audit-backend
  FRONTEND_REPO: kroks/pavilion_audit-frontend
  TAG: ${{ github.ref_name }}-${{ github.run_id }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        run: |
          docker build \
            -t $BACKEND_REPO:$TAG \
            -f image_classifier/backend/Dockerfile \
            image_classifier/backend
          docker push $BACKEND_REPO:$TAG

      - name: Build & Push Frontend
        run: |
          docker build \
            -t $FRONTEND_REPO:$TAG \
            -f image_classifier/frontend/Dockerfile \
            image_classifier
          docker push $FRONTEND_REPO:$TAG

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 120         # весь job может работать до 2 часов
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH (git pull & compose)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: "60m"   # ждем до 60 минут на выполнение скрипта
          script: |
            cd /home/${{ secrets.SERVER_USER }}/PavilionClassifier
            git pull origin main
            
            docker image prune -a -f
            docker builder prune -f

            export TAG=${{ github.ref_name }}-${{ github.run_id }}
            cd image_classifier

            docker-compose -f docker-compose.prod.yml pull backend frontend
            docker-compose -f docker-compose.prod.yml up -d --no-deps --build backend frontend
  
  
